[project]
name = "relai-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shivani Bhalsakle", email = "100023956+shivanibhalsakle@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = ["B008", "UP046", "UP047"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
